services:
  f1-feed-replay-service:
    build:
      context: .
      dockerfile: ./f1-feed-replay-service/Dockerfile
    container_name: f1-feed-replay-service
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./docker/replay-data:/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: f1-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -p 1883 -t healthcheck -m ping >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt-capture-helper:
    image: eclipse-mosquitto:2
    container_name: f1-mqtt-capture-helper
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./helpers/mqtt-capture/capture.sh:/helper/capture.sh:ro
      - ./docker/replay-data/mqtt-capture:/capture
    environment:
      CAPTURE_TOPIC_FILTER: f1/raw/#
      CAPTURE_OUTPUT_DIR: /capture
    command: ["/bin/sh", "/helper/capture.sh"]
    restart: unless-stopped

  