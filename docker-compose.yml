services:
  f1-feed-replay-service:
    build:
      context: .
      dockerfile: ./f1-feed-replay-service/Dockerfile
    container_name: f1-feed-replay-service
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./docker/replay-data:/data
    restart: unless-stopped

  event-normalizer-service:
    build:
      context: .
      dockerfile: ./event-normalizer-service/Dockerfile
    container_name: f1-event-normalizer-service
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    restart: unless-stopped

  race-state-service:
    build:
      context: .
      dockerfile: ./race-state-service/Dockerfile
    container_name: f1-race-state-service
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    tmpfs:
      - /data
    restart: unless-stopped

  telemetry-analytics-service:
    build:
      context: .
      dockerfile: ./telemetry-analytics-service/Dockerfile
    container_name: f1-telemetry-analytics-service
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
    ports:
      - "8083:8080"
      - "8084:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_ENVIRONMENT: Docker
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: f1-postgres
    environment:
      POSTGRES_DB: f1_telemetry
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: f1-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: meda016
      DOCKER_INFLUXDB_INIT_PASSWORD: meda016telemetry
      DOCKER_INFLUXDB_INIT_ORG: f1-platform
      DOCKER_INFLUXDB_INIT_BUCKET: f1-telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: f1-super-token
    ports:
      - "8086:8086"
    tmpfs:
      - /var/lib/influxdb2
      - /etc/influxdb2
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: f1-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -p 1883 -t healthcheck -m ping >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  raw-mqtt-capture-helper:
    image: eclipse-mosquitto:2
    container_name: f1-raw-mqtt-capture-helper
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./helpers/mqtt-capture/capture.sh:/helper/capture.sh:ro
    tmpfs:
      - /capture
    environment:
      CAPTURE_TOPIC_FILTER: f1/raw/#
      CAPTURE_OUTPUT_DIR: /capture
    command: ["/bin/sh", "/helper/capture.sh"]
    restart: unless-stopped

  canonical-mqtt-capture-helper:
    image: eclipse-mosquitto:2
    container_name: f1-canonical-mqtt-capture-helper
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./helpers/mqtt-capture/capture.sh:/helper/capture.sh:ro
    tmpfs:
      - /capture
    environment:
      CAPTURE_TOPIC_FILTER: f1/canonical/#
      CAPTURE_OUTPUT_DIR: /capture
    command: ["/bin/sh", "/helper/capture.sh"]
    restart: unless-stopped
