services:
  f1-feed-replay-service:
    build:
      context: .
      dockerfile: ./f1-feed-replay-service/Dockerfile
    container_name: f1-feed-replay-service
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./docker/replay-data:/data
    restart: unless-stopped

  event-normalizer-service:
    build:
      context: .
      dockerfile: ./event-normalizer-service/Dockerfile
    container_name: f1-event-normalizer-service
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    restart: unless-stopped

  ekuiper:
    image: lfedge/ekuiper:2.0.0
    container_name: f1-ekuiper
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "9081:9081"
      - "20498:20498"
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: tcp://mosquitto:1883
      KUIPER__BASIC__CONSOLELOG: "true"
      KUIPER__BASIC__IGNORECASE: "false"
    volumes:
      - ./docker/ekuiper/data:/kuiper/data
      - ./docker/ekuiper/log:/kuiper/log
    restart: unless-stopped

  ekuiper-init:
    image: curlimages/curl:8.7.1
    container_name: f1-ekuiper-init
    depends_on:
      ekuiper:
        condition: service_started
      race-state-service:
        condition: service_started
    volumes:
      - ./ekuiper/bootstrap:/bootstrap:ro
    command: ["/bin/sh", "/bootstrap/init-ekuiper.sh"]
    restart: "no"

  race-state-service:
    build:
      context: .
      dockerfile: ./race-state-service/Dockerfile
    container_name: f1-race-state-service
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./docker/race-state-data:/data
    restart: unless-stopped

  telemetry-analytics-service:
    build:
      context: .
      dockerfile: ./telemetry-analytics-service/Dockerfile
    container_name: f1-telemetry-analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
    ports:
      - "8083:8080"
      - "8084:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      DOTNET_ENVIRONMENT: Docker
    restart: unless-stopped

  telemetry-prediction-service:
    build:
      context: .
      dockerfile: ./telemetry-prediction-service/Dockerfile
    container_name: f1-telemetry-prediction-service
    ports:
      - "8087:8080"
    environment:
      APP_NAME: telemetry-prediction-service
      MODEL_PATH: /models/next_lap_model.joblib
      DATASET_PATH: /models/training/next_lap_training.csv
      CANONICAL_DATA_DIR: /data/canonical
      MIN_TRAINING_ROWS: 40
      MODEL_RANDOM_STATE: 42
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./docker/ml-models:/models
      - ./docker/mqtt-capture/canonical:/data/canonical:ro
    restart: unless-stopped

  telemetry-database-service:
    build:
      context: .
      dockerfile: ./telemetry-database-service/Dockerfile
    container_name: f1-telemetry-database-service
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
    ports:
      - "8085:8090"
    environment:
      SERVICE_PORT: 8090
      MQTT_ENABLED: "true"
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPICS: f1/canonical/session/info/updated,f1/canonical/session/status/updated,f1/canonical/track/status/updated,f1/canonical/lap/count/updated,f1/canonical/driver/list/updated/+,f1/canonical/timing/driver/updated/+,f1/canonical/timing/app/updated/+,f1/canonical/lap/series/updated/+,f1/canonical/tyres/current/updated/+,f1/canonical/tyres/stint/updated/+,f1/canonical/car/telemetry/updated/+
      MQTT_CLIENT_ID: f1-telemetry-database-service
      MQTT_KEEPALIVE_SECONDS: 30
      POSTGRES_CONNECTION_STRING: Host=postgres;Port=5432;Database=f1_telemetry;Username=f1;Password=f1_password
      INFLUX_ENABLED: "true"
      INFLUX_BASE_URL: http://influxdb:8086
      INFLUX_ORGANIZATION: f1-platform
      INFLUX_BUCKET: f1-telemetry
      INFLUX_TOKEN: f1-super-token
      INFLUX_WRITE_PRECISION: ns
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: f1-postgres
    environment:
      POSTGRES_DB: f1_telemetry
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: f1-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: meda016
      DOCKER_INFLUXDB_INIT_PASSWORD: meda016telemetry
      DOCKER_INFLUXDB_INIT_ORG: f1-platform
      DOCKER_INFLUXDB_INIT_BUCKET: f1-telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: f1-super-token
    ports:
      - "8086:8086"
    tmpfs:
      - /var/lib/influxdb2
      - /etc/influxdb2
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: f1-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -p 1883 -t healthcheck -m ping >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  canonical-training-data-capture:
    image: eclipse-mosquitto:2
    container_name: f1-canonical-training-data-capture
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./helpers/mqtt-capture/capture.sh:/helper/capture.sh:ro
      - ./docker/mqtt-capture/canonical:/capture
    environment:
      CAPTURE_TOPIC_FILTER: f1/canonical/#
      CAPTURE_OUTPUT_DIR: /capture
      CAPTURE_HOST: mosquitto
      CAPTURE_PORT: 1883
    command: ["/bin/sh", "/helper/capture.sh"]
    restart: unless-stopped
