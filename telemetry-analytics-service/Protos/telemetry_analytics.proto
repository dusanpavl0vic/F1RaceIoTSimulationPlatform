syntax = "proto3";

option csharp_namespace = "F1.TelemetryAnalytics.Service.Grpc";

package telemetryanalytics;

service TelemetryAnalytics {
  rpc GetDriverSegmentBuckets (DriverSegmentBucketsRequest) returns (DriverSegmentBucketsResponse);
  rpc GetDriverLapTelemetry (DriverLapTelemetryRequest) returns (DriverLapTelemetryResponse);
  rpc GetLatestDriverTelemetry (DriverTelemetryRequest) returns (DriverTelemetryResponse);
}

message DriverSegmentBucketsRequest {
  string session_id = 1;
  int32 driver_number = 2;
  int32 lap_number = 3;
  int32 bucket_count = 4;
}

message SegmentBucket {
  int32 bucket_index = 1;
  double start_progress_pct = 2;
  double end_progress_pct = 3;
  double avg_speed = 4;
  int32 max_speed = 5;
  double avg_throttle_pct = 6;
  double brake_usage_pct = 7;
  double drs_usage_pct = 8;
  string behavior = 9;
}

message DriverSegmentBucketsResponse {
  string session_id = 1;
  int32 driver_number = 2;
  int32 lap_number = 3;
  repeated SegmentBucket buckets = 4;
}

message DriverTelemetryRequest {
  string session_id = 1;
  int32 driver_number = 2;
  int32 max_samples = 3;
  string since_timestamp = 4;
  repeated string requested_metrics = 5;
}

message DriverLapTelemetryRequest {
  string session_id = 1;
  int32 driver_number = 2;
  int32 lap_number = 3;
  repeated string requested_metrics = 4;
}

message DriverLapTelemetryResponse {
  string session_id = 1;
  int32 driver_number = 2;
  int32 lap_number = 3;
  repeated string returned_metrics = 4;
  repeated LiveTelemetrySample samples = 5;
}

message DriverTelemetryResponse {
  string session_id = 1;
  int32 driver_number = 2;
  repeated string returned_metrics = 3;
  repeated LiveTelemetrySample samples = 4;
}

message LiveTelemetrySample {
  string session_id = 1;
  int32 driver_number = 2;
  int32 lap_number = 3;
  int32 stint_number = 4;
  int32 sample_index = 5;
  string timestamp = 6;
  int32 speed = 7;
  int32 rpm = 8;
  int32 throttle_pct = 9;
  int32 raw_throttle = 10;
  double brake_pct = 11;
  int32 raw_brake = 12;
  int32 gear = 13;
  bool drs_enabled = 14;
}
