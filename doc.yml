services:
  f1-feed-replay-service:
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8080:8080"
  event-normalizer-service:
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8081:8080"
  ekuiper:
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "9081:9081"
      - "20498:20498"
  ekuiper-init:
    depends_on:
      ekuiper:
        condition: service_started
      race-state-service:
        condition: service_started
  race-state-service:
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "8082:8080"
  telemetry-analytics-service:
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_started
    ports:
      - "8083:8080"
      - "8084:8081"
  telemetry-prediction-service:
    ports:
      - "8087:8080"
  telemetry-database-service:
    ports:
      - "8085:8090"
  postgres:
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  influxdb:
    ports:
      - "8086:8086"
  mosquitto:
    ports:
      - "1883:1883"
  canonical-training-data-capture:
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./helpers/mqtt-capture/capture.sh:/helper/capture.sh:ro
      - ./docker/mqtt-capture/canonical:/capture
